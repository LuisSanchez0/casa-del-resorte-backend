spring:
  config:
    import:
      - optional:file:.env[.properties]

  application:
    name: spring-house

  mvc:
    servlet:
      path: /api

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 30MB

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

  error:
    include-stacktrace: never
    include-exception: false
    include-binding-errors: never

app:
  cors:
    origin: ${CLIENT_ORIGIN}

security:
  access-token:
    secret-key: ${AT_SK}
    expiration-time: ${AT_ET}

  refresh-token:
    expiration-time: ${RT_ET}

  cookie:
    secure: ${COOKIE_SECURE:false}
    same-site: ${COOKIE_SAME_SITE:Lax}

aws:
  s3:
    region: ${AWS_REGION:us-east-1}

    bucket:
      name: ${AWS_BUCKET_NAME:spring-house}