services:
  postgres:
    image: postgres:18
    container_name: db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      TZ: ${DB_ZONE}
    ports:
      - ${DB_PORT}:5432

  redis:
    image: redis:8.4
    container_name: cache
    ports:
      - ${CACHE_PORT}:6379